name: Binance Setup Alert Bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: binance-alert-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAMES: "15m,1h,4h"
          TOP_N: "200"
        run: python binance_setup_alert_bot.py
      - name: Commit updated state file
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add alert_state.json
          if git diff --staged --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update alert state [skip ci]"
          git pull --rebase origin main
          git push origin main
